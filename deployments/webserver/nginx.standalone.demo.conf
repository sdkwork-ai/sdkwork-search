# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/search/webserver.pid;
error_log /var/log/sdkwork/search/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name search-demo.sdkwork.com search-demo.birdcoder.com search-demo.dtupay.com search-demo.noaper.com search-demo.sdkwork.cn search-demo.birdcoder.cn search-demo.dtupay.cn search-demo.noaper.cn search-demo.skubc.com search-demo.skubc.cn search-demo.zowalk.com search-demo.zowalk.cn search-demo.offer86.com search-demo.offer86.cn search-demo.86offer.com search-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
