# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/search/webserver.pid;
error_log /var/log/sdkwork/search/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name search-test.sdkwork.com search-test.birdcoder.com search-test.dtupay.com search-test.sdkwork.cn search-test.birdcoder.cn search-test.dtupay.cn search-test.skubc.com search-test.skubc.cn search-test.zowalk.com search-test.zowalk.cn search-test.offer86.com search-test.offer86.cn search-test.86offer.com search-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
