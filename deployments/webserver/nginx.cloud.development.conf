# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/search/webserver.pid;
error_log /var/log/sdkwork/search/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name search-dev.sdkwork.com search-dev.birdcoder.com search-dev.dtupay.com search-dev.sdkwork.cn search-dev.birdcoder.cn search-dev.dtupay.cn search-dev.skubc.com search-dev.skubc.cn search-dev.zowalk.com search-dev.zowalk.cn search-dev.offer86.com search-dev.offer86.cn search-dev.86offer.com search-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
